- rq_id: RQ4
  exact_wording: Does the hierarchical cross-attention between Swin and Video Swin improve detection performance compared
    to other spatio-temporal models such as CAST and TSFF-Net?
  included: true
  claim: Test TLBG-HCA using topology and capacity controls; use CAST/TSFF-Net only as verified external evidence.
  models:
  - swinfusion_pp
  - topology_non_attentive_control
  - capacity_matched_no_exchange_control
  - cast
  - tsff_net
  dataset_conditions:
  - ffpp_c23
  - ffpp_c40
  - celeb_df_v2
  - deeperforensics_binary
  matrix_roles:
  - tlbg_hca_control
  - named_external_comparator
  evaluation_unit: one video for common protocol
  metrics: *id001
  statistical_family: dependency-clustered intervals/tests with paired common-video analysis and multiplicity control (D-19/D-40)
  outputs:
    files: results/metrics/rq4_*
    tables:
    - control_ablation
    - cast_tsff_status
    figures:
    - ablation_effects
    discussion: reports/chapter4/discussion/rq4.md
  limitations:
  - TSFF-Net is spatial/frequency fusion; external values alone cannot establish TLBG-HCA causality.
