research_questions:
- rq_id: RQ1
  exact_wording: To what extent does SwinFusion++ improve video-level deepfake detection performance compared with standalone
    Swin Transformer and standalone Video Swin Transformer under in-distribution and cross-dataset evaluation, in terms of
    Accuracy, Precision, Recall, F1-Score, and ROC-AUC?
  included: true
  claim: Fixed-recipe architecture effect plus separately labeled optimized-system and directional-transfer evidence.
  models:
  - swin_b
  - video_swin_b
  - swinfusion_pp
  dataset_conditions:
  - ffpp_c23
  - ffpp_c40
  - celeb_df_v2
  - deeperforensics_binary
  matrix_roles:
  - fixed_recipe_architecture_comparison
  - bo_optimized_system_comparison
  - directional_frozen_transfer_core
  evaluation_unit: one video for common protocol
  metrics: &id001
  - roc_auc
  - pr_auc
  - accuracy
  - precision
  - recall
  - specificity
  - f1
  - fpr
  - fnr
  - coverage
  - preprocessing_failure_rate
  statistical_family: dependency-clustered intervals/tests with paired common-video analysis and multiplicity control (D-19/D-40)
  outputs:
    files: results/metrics/rq1_*
    tables:
    - fixed_architecture
    - optimized_system
    - directional_transfer
    figures:
    - clustered_ci_point_plots
    discussion: reports/chapter4/discussion/rq1.md
  limitations:
  - BO comparison is configured-system evidence, not pure architecture causality.
  experiment_ids:
  - rq1_fixed_swin_b_ffpp_c23
